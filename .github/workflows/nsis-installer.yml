name: Build Cross-Platform Deployments

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore GenealogyDiffUtility.csproj

    - name: Publish Windows Binaries
      run: dotnet publish GenealogyDiffUtility.csproj -c Release -r win-x64 --no-self-contained -o ./publish

    - name: Install NSIS
      uses: negrutiu/nsis-install@v2
      with:
        version: '3.10'

    - name: Compile NSIS Installer
      run: |
        makensis installer.nsi
        Move-Item -Path "GenealogyDiffUtility-Setup.exe" -Destination "GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe"

    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenealogyDiffUtility-Win-${{ github.ref_name }}
        path: GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore GenealogyDiffUtility.csproj

    - name: Publish Linux Binaries
      run: dotnet publish GenealogyDiffUtility.csproj -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=true -o ./AppDir/usr/bin

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y imagemagick

    - name: Construct AppImage Shell Structure
      run: |
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        
        cat <<EOF > AppDir/GenealogyDiffUtility.desktop
        [Desktop Entry]
        Type=Application
        Name=GenealogyDiffUtility
        Comment=A utility to compare Genealogy data
        Exec=GenealogyDiffUtility
        Icon=GenealogyDiffUtility
        Categories=Development;Utility;
        EOF
        
        convert -size 256x256 xc:transparent AppDir/GenealogyDiffUtility.png
        cp AppDir/GenealogyDiffUtility.png AppDir/usr/share/icons/hicolor/256x256/apps/GenealogyDiffUtility.png
        
        cat <<EOF > AppDir/AppRun
        #!/bin/sh
        SELF=\$(readlink -f "\$0")
        HERE=\$(dirname "\$SELF")
        exec "\$HERE/usr/bin/GenealogyDiffUtility" "\$@"
        EOF
        chmod +x AppDir/AppRun

    - name: Download and Unpack AppImage Compiler Tool
      run: |
        wget -O appimagetool-x86_64.AppImage "https://github.com"
        chmod a+x appimagetool-x86_64.AppImage
        ./appimagetool-x86_64.AppImage --appimage-extract

    - name: Build Universal Linux AppImage Package
      run: |
        export ARCH=x86_64
        ./squashfs-root/AppRun ./AppDir ./GenealogyDiffUtility-${{ github.ref_name }}.AppImage

    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenealogyDiffUtility-Linux-${{ github.ref_name }}
        path: GenealogyDiffUtility-${{ github.ref_name }}.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore GenealogyDiffUtility.csproj

    - name: Publish macOS Binaries
      run: |
        dotnet publish GenealogyDiffUtility.csproj \
          -c Release \
          -r osx-x64 \
          --self-contained true \
          -p:PublishSingleFile=true \
          -o ./publish-mac-bin

    - name: Structure Native Mac App Bundle
      run: |
        mkdir -p "GenealogyDiffUtility.app/Contents/MacOS"
        mkdir -p "GenealogyDiffUtility.app/Contents/Resources"
        
        cp ./publish-mac-bin/GenealogyDiffUtility "GenealogyDiffUtility.app/Contents/MacOS/"
        chmod +x "GenealogyDiffUtility.app/Contents/MacOS/GenealogyDiffUtility"
        
        cat <<EOF > "GenealogyDiffUtility.app/Contents/Info.plist"
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
        <plist version="1.0">
        <dict>
            <key>CFBundleExecutable</key>
            <string>GenealogyDiffUtility</string>
            <key>CFBundleIdentifier</key>
            <string>com.ghcaveman.genealogydiffutility</string>
            <key>CFBundleName</key>
            <string>GenealogyDiffUtility</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0.0</string>
            <key>CFBundleVersion</key>
            <string>1.0.0</string>
            <key>LSMinimumSystemVersion</key>
            <string>10.15</string>
        </dict>
        </plist>
        EOF

    - name: Create DMG File
      run: |
        brew install create-dmg
        create-dmg \
          --volname "GenealogyDiffUtility Setup" \
          --window-size 500 300 \
          --icon-size 100 \
          --icon "GenealogyDiffUtility.app" 175 120 \
          --app-drop-link 325 120 \
          "./GenealogyDiffUtility-${{ github.ref_name }}.dmg" \
          "./GenealogyDiffUtility.app"

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenealogyDiffUtility-Mac-${{ github.ref_name }}
        path: GenealogyDiffUtility-${{ github.ref_name }}.dmg

  create-release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Windows Asset
      uses: actions/download-artifact@v4
      with:
        name: GenealogyDiffUtility-Win-${{ github.ref_name }}
        path: ./artifacts

    - name: Download Linux Asset
      uses: actions/download-artifact@v4
      with:
        name: GenealogyDiffUtility-Linux-${{ github.ref_name }}
        path: ./artifacts

    - name: Download macOS Asset
      uses: actions/download-artifact@v4
      with:
        name: GenealogyDiffUtility-Mac-${{ github.ref_name }}
        path: ./artifacts

    - name: Create Multi-Platform GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          ./artifacts/GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe \
          ./artifacts/GenealogyDiffUtility-${{ github.ref_name }}.AppImage \
          ./artifacts/GenealogyDiffUtility-${{ github.ref_name }}.dmg \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes
