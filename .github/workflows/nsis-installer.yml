name: Build Avalonia App & NSIS Installer

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    outputs:
      tag_name: ${{ github.ref_name }}

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    # Setup standard SDK environment for modern .NET 10 compilation
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore Dependencies
      run: dotnet restore GenealogyDiffUtility.csproj

    # Publishes a self-contained, high-performance runtime configuration folder
    - name: Publish Application
      run: dotnet publish GenealogyDiffUtility.csproj -c Release -r win-x64 --no-self-contained -o ./publish

    - name: Install NSIS
      uses: negrutiu/nsis-install@v2
      with:
        version: '3.10'

    - name: Compile NSIS Installer
      run: |
        makensis installer.nsi
        Move-Item -Path "GenealogyDiffUtility-Setup.exe" -Destination "GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe"

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenealogyDiffUtility-Installer-${{ github.ref_name }}
        path: GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe

  create-release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Download Built Installer Artifact
      uses: actions/download-artifact@v4
      with:
        name: GenealogyDiffUtility-Installer-${{ needs.build.outputs.tag_name }}
        path: ./artifacts

    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ needs.build.outputs.tag_name }}" \
          ./artifacts/GenealogyDiffUtility-Setup-${{ needs.build.outputs.tag_name }}.exe \
          --title "Release ${{ needs.build.outputs.tag_name }}" \
          --generate-notes
