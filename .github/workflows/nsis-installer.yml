name: Build Cross-Platform Deployments

on:
  push:
    branches: [ "main" ]
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Publish Windows
      run: dotnet publish GenealogyDiffUtility.csproj -c Release -r win-x64 --no-self-contained -o ./publish
    - name: Install NSIS
      uses: negrutiu/nsis-install@v2
    - name: Compile NSIS
      run: |
        makensis installer.nsi
        Move-Item -Path "GenealogyDiffUtility-Setup.exe" -Destination "GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe"
    - name: Upload Windows Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenealogyDiffUtility-Win-${{ github.ref_name }}
        path: GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'
    - name: Publish Linux
      run: dotnet publish GenealogyDiffUtility.csproj -c Release -r linux-x64 -o ./publish-linux
    - name: Install DotnetPackager Tool
      run: dotnet tool install --global DotnetPackaging.Remote.CLI
    - name: Package AppImage
      run: |
        dotnetpackager appimage from-directory \
          --directory ./publish-linux \
          --output ./GenealogyDiffUtility-${{ github.ref_name }}.AppImage \
          --application-name "GenealogyDiffUtility" \
          --version "${{ github.ref_name }}"
    - name: Upload Linux Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenealogyDiffUtility-Linux-${{ github.ref_name }}
        path: GenealogyDiffUtility-${{ github.ref_name }}.AppImage

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Install Bundler Tool
      run: dotnet tool install --global dotnet-bundle

    # Creates the GenealogyDiffUtility.app structure automatically
    - name: Create App Bundle
      run: dotnet bundle GenealogyDiffUtility.csproj -c Release -r osx-x64 --output ./publish-mac

    # Uses the native macOS utility to pack the bundle into a mountable installer disk image
    - name: Create DMG File
      run: |
        brew install create-dmg
        create-dmg \
          --volname "GenealogyDiffUtility Setup" \
          --window-size 500 300 \
          --icon-size 100 \
          --icon "GenealogyDiffUtility.app" 175 120 \
          --app-drop-link 325 120 \
          "./GenealogyDiffUtility-${{ github.ref_name }}.dmg" \
          "./publish-mac/GenealogyDiffUtility.app"

    - name: Upload macOS Artifact
      uses: actions/upload-artifact@v4
      with:
        name: GenealogyDiffUtility-Mac-${{ github.ref_name }}
        path: GenealogyDiffUtility-${{ github.ref_name }}.dmg

  create-release:
    needs: [build-windows, build-linux, build-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Download Windows Asset
      uses: actions/download-artifact@v4
      with:
        name: GenealogyDiffUtility-Win-${{ github.ref_name }}
        path: ./artifacts
    - name: Download Linux Asset
      uses: actions/download-artifact@v4
      with:
        name: GenealogyDiffUtility-Linux-${{ github.ref_name }}
        path: ./artifacts
    - name: Download macOS Asset
      uses: actions/download-artifact@v4
      with:
        name: GenealogyDiffUtility-Mac-${{ github.ref_name }}
        path: ./artifacts
    - name: Create GitHub Release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh release create "${{ github.ref_name }}" \
          ./artifacts/GenealogyDiffUtility-Setup-${{ github.ref_name }}.exe \
          ./artifacts/GenealogyDiffUtility-${{ github.ref_name }}.AppImage \
          ./artifacts/GenealogyDiffUtility-${{ github.ref_name }}.dmg \
          --title "Release ${{ github.ref_name }}" \
          --generate-notes
